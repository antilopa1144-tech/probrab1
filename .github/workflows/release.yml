name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.1)'
        required: true
        type: string

jobs:
  create-release:
    name: 📦 Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🏷️ Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: ✅ Verify app version
        run: |
          APP_VERSION=$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+$/\1/p' pubspec.yaml)
          RELEASE_VERSION="${{ steps.get_version.outputs.version }}"
          if [ -z "$APP_VERSION" ] || [ "$APP_VERSION" != "$RELEASE_VERSION" ]; then
            echo "pubspec version '$APP_VERSION' does not match release '$RELEASE_VERSION'"
            exit 1
          fi

      - name: 📝 Generate changelog
        id: changelog
        run: |
          echo "# Release v${{ steps.get_version.outputs.version }}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## Changes" >> RELEASE_NOTES.md
          git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> RELEASE_NOTES.md || true

      - name: 🎉 Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ steps.get_version.outputs.version }}
        run: |
          gh release create "$TAG_NAME" \
            --target "$GITHUB_SHA" \
            --title "Release $TAG_NAME" \
            --notes-file RELEASE_NOTES.md \
            --draft

  build-android-release:
    name: 🤖 Build Android Release
    runs-on: ubuntu-latest
    needs: create-release
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🔧 Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.2'
          channel: 'stable'
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🔍 Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 🧪 Test
        run: flutter test

      - name: 🔐 Setup signing
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ] || [ -z "$ANDROID_KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "Release signing or Firebase secrets are not configured"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > android/masterok-release.jks
          cat > android/key.properties << EOL
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../masterok-release.jks
          EOL

      - name: 🏗️ Build APK
        run: flutter build apk --release

      - name: 🏗️ Build App Bundle
        run: flutter build appbundle --release

      - name: 📦 Prepare release artifacts
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release-artifacts/probrab-ai-v${VERSION}-android.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
            "release-artifacts/probrab-ai-v${VERSION}-android.aab"

      - name: 📤 Upload Android artifacts to Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: v${{ needs.create-release.outputs.version }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          gh release upload "$TAG_NAME" \
            "release-artifacts/probrab-ai-v${VERSION}-android.apk" \
            "release-artifacts/probrab-ai-v${VERSION}-android.aab"

  notify-release:
    name: 📢 Notify Release
    runs-on: ubuntu-latest
    needs: [create-release, build-android-release]
    if: always()

    steps:
      - name: ✅ Release Success
        if: ${{ needs.build-android-release.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit "v${{ needs.create-release.outputs.version }}" --draft=false
          echo "🎉 Release v${{ needs.create-release.outputs.version }} created successfully!"
          echo "📦 Android artifacts uploaded"

      - name: ❌ Release Failed
        if: ${{ needs.build-android-release.result == 'failure' }}
        run: |
          echo "❌ Release build failed!"
          exit 1
